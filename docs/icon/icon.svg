<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1f1f1f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd8ff"/>
      <stop offset="1" stop-color="#2f8fd8"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  <!-- history cards behind the board -->
  <rect x="78" y="56" width="120" height="150" rx="16" fill="#ffffff" fill-opacity="0.12"/>
  <!-- clipboard board -->
  <rect x="58" y="70" width="124" height="152" rx="18" fill="#f3f3f3"/>
  <!-- clip -->
  <rect x="88" y="56" width="64" height="30" rx="10" fill="url(#accent)"/>
  <rect x="106" y="62" width="28" height="9" rx="4.5" fill="#1f1f1f" fill-opacity="0.35"/>
  <!-- text lines -->
  <rect x="78" y="104" width="84" height="12" rx="6" fill="#9a9a9a"/>
  <rect x="78" y="128" width="64" height="12" rx="6" fill="#bdbdbd"/>
  <rect x="78" y="152" width="74" height="12" rx="6" fill="#bdbdbd"/>
  <!-- Super+V badge -->
  <circle cx="186" cy="186" r="44" fill="url(#accent)"/>
  <circle cx="186" cy="186" r="44" fill="none" stroke="#1f1f1f" stroke-width="6"/>
  <path d="M166 166 L186 208 L206 166" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
